[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mariogeiger/layercraft"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "warn"

[workspace.dependencies]
i_overlay = "9.1"
i_triangle = "0.50"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
zip = { version = "9.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
md-5 = "0.11"
png = "0.18"
clap = { version = "4.6", features = ["derive"] }
